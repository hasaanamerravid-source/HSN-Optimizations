plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "hsn-optimizations"
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hsn-optimizations" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	sodiumStubs {
		java.srcDir "src/sodiumStubs/java"
	}
}

afterEvaluate {
	sourceSets.client.compileClasspath += sourceSets.sodiumStubs.output
}

/**
 * Minecraft 26.1+ is unobfuscated. Loom 1.17 no longer creates remapping
 * configurations, so {@code modImplementation} does not exist there.
 * Official Fabric example-mod 26.2 uses {@code implementation} for mods.
 */
def addMod(String notation) {
	if (configurations.findByName("modImplementation") != null) {
		return dependencies.add("modImplementation", notation)
	}
	return dependencies.add("implementation", notation)
}

dependencies {
	// Minecraft 26.2 is unobfuscated — do NOT use mappings loom.officialMojangMappings()
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	addMod "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	addMod "com.terraformersmc:modmenu:${project.modmenu_version}"

	compileOnly sourceSets.sodiumStubs.output

	// Official Sodium Config API (compile-time only — Sodium provides it at runtime)
	if (configurations.findByName("modCompileOnly") != null) {
		modCompileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
	} else {
		compileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
	}

	implementation files("libs/hsn-polyglot.jar")
	implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
	implementation "org.scala-lang:scala-library:2.13.16"
	if (configurations.findByName("include") != null) {
		// NOTE: hsn-polyglot.jar is a flat local file dependency with no module
		// component / capabilities, so Loom's jar-in-jar "include" configuration
		// cannot nest it (this was the cause of the processIncludeJars failure:
		// "Attempted to nest artifact hsn-polyglot.jar which is not a module
		// component and has no capabilities"). It stays on the compile/runtime
		// classpath via the "implementation files(...)" declaration above; if you
		// need it physically merged into the final mod jar, use the Shadow plugin
		// or a manual jar-merge task instead of Loom's include{} mechanism.
		include "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
		include "org.scala-lang:scala-library:2.13.16"
	}
}


processResources {
	def ver = project.version
	inputs.property "version", ver
	filesMatching("fabric.mod.json") {
		expand "version": ver
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
