plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "hsn-optimizations"
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://maven.architectury.dev/" }
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hsn-optimizations" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

/**
 * Minecraft 26.1+ is unobfuscated. Loom 1.17 no longer creates remapping
 * configurations, so {@code modImplementation} does not exist there.
 * Official Fabric example-mod 26.2 uses {@code implementation} for mods.
 */
def addMod(String notation) {
	if (configurations.findByName("modImplementation") != null) {
		return dependencies.add("modImplementation", notation)
	}
	return dependencies.add("implementation", notation)
}

dependencies {
	// Minecraft 26.2 is unobfuscated — do NOT use mappings loom.officialMojangMappings()
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	addMod "dev.architectury:architectury-fabric:${project.architectury_version}"
	addMod "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	addMod "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Official Sodium Config API (compile-time only — Sodium provides it at runtime)
	if (configurations.findByName("modCompileOnly") != null) {
		modCompileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
	} else {
		compileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
	}
}

processResources {
	def ver = project.version
	inputs.property "version", ver
	filesMatching("fabric.mod.json") {
		expand "version": ver
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
