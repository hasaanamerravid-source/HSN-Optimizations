plugins {
	// Minecraft 26.1+ is unobfuscated. The legacy "fabric-loom" id is for
	// remapped/obfuscated games and will misconfigure a 26.3 workspace.
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

loom {
	mods {
		"hsn-optimizations" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			vmArgs "-XX:+UseZGC", "-XX:+AlwaysPreTouch"
			ideConfigGenerated = true
		}
		server {
			vmArgs "-XX:+UseZGC", "-XX:+AlwaysPreTouch"
			ideConfigGenerated = true
		}
	}
}

sourceSets {
	sodiumStubs {
		java.srcDir "src/sodiumStubs/java"
	}
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases"
	}
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
	maven { url = "https://maven.isxander.dev/releases" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://api.modrinth.com/maven" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// net.fabricmc.fabric-loom (no-remap) has no modImplementation / modCompileOnly / include.
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "net.caffeinemc:sodium-fabric-api:${project.sodium_api_version}"
	compileOnly sourceSets.sodiumStubs.output
	// Optional YACL — compile-time only; runtime presence checked in HSNYaclCompat.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	// Optional Cloth Config — primary settings UI when installed.
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
}

afterEvaluate {
	sourceSets.main.compileClasspath += sourceSets.sodiumStubs.output
}

// Storefronts: default jar is Java-only. Bundled ELF trips malware queues
// and Modrinth native-binary review. Opt in with -PbundleNatives=true.
def bundleNatives = project.findProperty("bundleNatives") == "true"

processResources {
	inputs.property "version", project.version
	inputs.property "bundleNatives", bundleNatives
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	exclude "natives/**"
}

if (bundleNatives) {
	processResources {
		from("native/prebuilt") {
			into "natives"
			include "linux-x86_64/*.so"
		}
	}
}

tasks.named("jar").configure {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	doLast {
		def leaked = []
		zipTree(archiveFile.get()).visit { f ->
			if (f.name.endsWith(".so") || f.name.endsWith(".dll") || f.name.endsWith(".wasm") || f.name.endsWith(".exe")) {
				leaked << f.relativePath
			}
		}
		if (leaked && !bundleNatives) {
			throw new GradleException("CurseForge jar contained natives: " + leaked)
		}
		logger.lifecycle(bundleNatives
				? "Jar includes optional Linux natives."
				: "Jar is Java-only (Modrinth / CurseForge-safe).")
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["--add-modules", "jdk.incubator.vector"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("runClientFabric") {
	group = "application"
	description = "Launch Minecraft 26.3 Fabric client"
	dependsOn "runClient"
}

tasks.register("runServerFabric") {
	group = "application"
	dependsOn "runServer"
}
