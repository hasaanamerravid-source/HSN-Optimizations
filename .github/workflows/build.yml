name: Build Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: "25"
        distribution: "oracle"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build -PbundleNatives=true --no-daemon --stacktrace

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Mod-Jar
        path: build/libs/*.jar
