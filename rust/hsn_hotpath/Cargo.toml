[package]
name = "hsn_hotpath"
version = "0.1.0"
edition = "2021"
description = "Optional batch distance tests. Not used on the per-entity Java path."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
# Enable FMA and wide vectorization for x86_64 when available.
# RUSTFLAGS="-C target-cpu=x86-64-v3" in the Makefile enables AVX2 globally.

[profile.release.build-override]
opt-level = 3
codegen-units = 1
